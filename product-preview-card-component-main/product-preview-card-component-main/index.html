<!doctype html>
<html lang="en">
    <head>
        <script src="tailwind.min.js"></script>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
            rel="stylesheet"
        />
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link
            rel="icon"
            type="image/png"
            sizes="32x32"
            href="./images/favicon-32x32.png"
        />

        <title>Abdulmujeeb Product preview card</title>
    </head>
    <body
        class="bg-[hsl(30,38%,92%)] grid min-w-full min-h-screen place-content-center font-[Montserrat] lg:place-content-center"
    >
        <div
            class="bg-white w-[345px] rounded-xl flex flex-col gap-6 lg:grid lg:grid-cols-2 lg:w-1/2 lg:mx-auto "
        >
            <picture>
                <source
                    srcset="images/image-product-mobile.jpg"
                    media="(max-width: 758px)"
                    class="object-cover"
                />
                <img
                    src="images/image-product-desktop.jpg"
                    alt="preview image of the perfume"
                    class="object-cover rounded-t-xl lg:rounded-s-xl lg:rounded-t-none"
                />
            </picture>
            <div class="mx-6 lg:pt-8">
                <p
                    class="uppercase text-[18px] tracking-widest text-[hsl(228,12%,48%)] mb-4 lg:mb-6 lg:tracking-[5px]"
                >
                    Perfume
                </p>
                <h1
                    class="text-3xl lg:text-4xl lg:w-[70%] w-[100%] font-bold mb-4 lg:mb-6 font-[Fraunces]"
                >
                    Gabrielle Essence Eau De Parfum
                </h1>
                <p
                    class="tracking-normal text-[14px] text-[hsl(228,12%,37%)] mb-4 lg:mb-6 w-[95%] lg:w-[90%] lg:text-[19px] leading-2 lg:leading-8"
                >
                    A floral, solar and voluptuous interpretation composed by
                    Olivier Polge, Perfumer-Creator for the House of CHANEL.
                </p>
                <p
                    class="text-green-700 font-bold mb-4 text-4xl font-[Fraunces] lg:mb-10"
                >
                    $149.99
                    <span
                        class="font-normal text-[14px] text-gray-700 line-through decoration-gray-700 align-text-top ml-4"
                    >
                        $169.99
                    </span>
                </p>
                <a
                    href="#"
                    class="block bg-[hsl(158,36%,37%)] text-center align-text-bottom mb-8 py-3 lg:py-5 rounded-md text-white font-bold tracking-wide focus:ring-2 focus:ring-pink-400 focus:ring-offset-2 hover:ring-2 hover:ring-pink-400 hover:ring-offset-2 transition-all duration-[1s] linear"
                >
                    <img
                        src="images/icon-cart.svg"
                        alt=""
                        class="inline align-baseline mr-1"
                    />
                    Add to Cart
                </a>
            </div>
        </div>

        <!--   <div class="attribution">
            Challenge by
            <a
                href="https://www.frontendmentor.io?ref=challenge"
                target="_blank"
            >
                Frontend Mentor
            </a>
            . Coded by
            <a href="#">Your Name Here</a>
            .
        </div> -->
    </body>
</html>
